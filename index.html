<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Library Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="var s=document.createElement('script');s.src='xlsx.full.min.js';document.head.appendChild(s)"></script>
<style>
:root{--ink:#1d1b4b;--violet:#6c3df4;--coral:#ff5d73;--sun:#ffc93c;--teal:#12c2a9;--sky:#3ba7ff;--bg:#f5f2ff;--card:#fff;--mut:#6b6894}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
h1,h2,h3,.brand b{font-family:'Baloo 2',Nunito,sans-serif;margin:0}
aside{width:250px;background:linear-gradient(170deg,#2b1f7a,#6c3df4 70%,#b23cff);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.logo{width:56px;height:56px;border-radius:16px;background:#fff3;border:2px dashed #fff9;display:grid;place-items:center;font-size:10px;text-align:center;line-height:1.1;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}.brand b{font-size:19px;line-height:1.15}
nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:14px;width:100%;box-sizing:border-box;font-weight:700;color:#e9e3ff}
nav button:hover{background:#fff2}nav button.on{background:#fff;color:var(--violet)}nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun)}
main{flex:1;padding:24px 30px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}.top h1{font-size:30px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 13px;border-radius:99px;font-weight:700;font-size:13px;background:#fff;border:2px solid #e4defb}
.chip.on{border-color:var(--teal);color:#0a8f7c}.chip.off{border-color:var(--coral);color:#d63a52}
button.b,.tools button,.act button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;background:var(--violet);color:#fff}
button.alt{background:var(--sun)!important;color:var(--ink)!important}button.warn,.act .dl{background:#ffe3e7;color:#c9264a}.act button{background:#ece6ff;color:var(--violet)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:22px}
.tile{border-radius:22px;padding:18px 20px;color:#fff}.tile b{font:800 38px 'Baloo 2',sans-serif;display:block;line-height:1.1}
.t1{background:linear-gradient(135deg,#6c3df4,#9a6bff)}.t2{background:linear-gradient(135deg,#ff5d73,#ff8d6b)}.t3{background:linear-gradient(135deg,#12c2a9,#4be0a0)}.t4{background:linear-gradient(135deg,#3ba7ff,#6c7bff)}.t5{background:linear-gradient(135deg,#ffb800,#ff8a00);color:#3a2300}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 6px 24px #6c3df41a;margin-bottom:20px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select{font:inherit;padding:10px 13px;border-radius:12px;border:2px solid #e4defb;background:#fff;color:var(--ink);width:100%}.tools input{max-width:300px}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;color:var(--mut);font-size:13px;padding:8px;border-bottom:2px solid #eee9ff}.tbl td{padding:10px 8px;border-bottom:1px solid #f0ecff;vertical-align:middle}
.tbl small{color:var(--mut)}.wrap{overflow-x:auto}.act{white-space:nowrap}.act button{padding:6px 12px;margin-right:6px}
.pill{padding:3px 11px;border-radius:99px;font-weight:700;font-size:12px}.ok{background:#d9faf4;color:#0a7d6c}.late{background:#ffe3e7;color:#c9264a}.out{background:#fff0c2;color:#7a5200}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}label{font-weight:700;font-size:13px;display:block;margin-bottom:4px}
dialog{border:0;border-radius:24px;padding:24px;width:min(460px,92vw);box-shadow:0 20px 60px #1d1b4b55}dialog::backdrop{background:#1d1b4b88}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:9}#toast.show{opacity:1}
.empty{text-align:center;color:var(--mut);padding:28px}textarea{width:100%;height:150px;font:12px monospace;border-radius:12px;border:2px solid #e4defb;padding:10px}
.hero{display:flex;align-items:center;gap:18px;padding:22px 28px;margin-bottom:22px;border-radius:26px;color:#fff;background:linear-gradient(120deg,#2b1f7a,#6c3df4 55%,#ff5d73);position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero:before{right:-50px;top:-70px;width:240px;height:240px;background:#ffc93c55}
.hero:after{right:140px;bottom:-90px;width:180px;height:180px;background:#12c2a944}
.hero .logo{width:76px;height:76px;position:relative;z-index:1}
.hero div{position:relative;z-index:1}.hero h2{font-size:30px;line-height:1.1}.hero p{margin:3px 0 0;opacity:.92}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap}.brand{width:100%;margin:0}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto;padding:8px 12px}main{padding:16px}.hero{padding:18px}.hero h2{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{aside,.chips,.tools,.hero{display:none!important}body{display:block}}
#login{position:fixed;inset:0;background:linear-gradient(160deg,#2b1f7a,#6c3df4 60%,#b23cff);display:grid;place-items:center;z-index:20;padding:16px;overflow:auto}#login[hidden]{display:none}
.lbox{background:#fff;border-radius:26px;padding:28px;width:min(400px,100%);display:grid;gap:6px}.lbox .logo{background:#ece6ff;border-color:#b9a6ff;color:var(--violet);margin:0 auto 6px}.err{color:#c9264a;font-weight:700;min-height:1.2em;margin:0}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:#f5f2ff;border:0;border-radius:14px;padding:10px 14px;margin-top:8px;font:inherit;color:var(--ink);cursor:pointer}button.res:hover{background:#ece6ff}
.scard{background:linear-gradient(135deg,#12c2a9,#3ba7ff);color:#fff;border-radius:16px;padding:12px 16px;margin-top:12px}button:disabled{opacity:.4;cursor:default}
</style></head><body>
<aside><div class="brand"><div class="logo" id="lg">Your school logo</div><b id="sn">Your School Name</b></div>
<nav id="nav"></nav></aside>
<main><div class="hero"><div class="logo" id="hl"></div><div><p>Welcome to the library of</p><h2 id="hn"></h2><p id="hd"></p></div></div><div class="top"><h1 id="ttl"></h1><div class="chips"><span class="chip" id="net"></span><span class="chip" id="xl">Excel: not linked</span><span class="chip" id="usr"></span><button class="b" onclick="sync(1)">Sync now</button><button class="b alt" onclick="logout()">Log out</button></div></div><div id="v"></div></main>
<div id="login" hidden></div><dialog id="dlg"></dialog><div id="toast"></div>
<script>
/* BRANDING (optional): set a default name and a logo file kept beside this HTML file, e.g. logo:'logo.png'.
   If your Google Sheet has a 'Branding' tab and the Apps Script 'brand' action, those values override these. */
window.BRAND={name:'',logo:''};
const K='school_library_v1',TABS=[['dash','🏠','Dashboard'],['books','📚','Books'],['members','🎓','Students'],['issue','🔖','Issue & return'],['rec','🧾','Records'],['rep','📊','Reports'],['set','⚙️','Settings']];
const DEFAULT_GAS='https://script.google.com/macros/s/AKfycbytfyMqVRWRmxxzBwo9pz_XYuUA0qhUZ1R5DEQ9CG53vKP5-E2Mju8UXtxrDOTI2kJmdQ/exec';
let D=load(),tab='dash',q='',flt='all',fh=null,tm1,tm2,me=null,pg=0,cf='',stu=null,idle;D.users=D.users||[];
function load(){try{const d=JSON.parse(localStorage[K]);if(d)return d}catch(e){}return{settings:{name:'',logo:'',gas:'',fine:2,days:14},books:[],members:[],issues:[],updated:0}}
const $=id=>document.getElementById(id),h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>ymd(new Date()),addD=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)},diff=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
function persist(){localStorage[K]=JSON.stringify(D)}
function save(){D.updated=Date.now();persist();clearTimeout(tm1);tm1=setTimeout(writeFile,800);clearTimeout(tm2);tm2=setTimeout(()=>sync(0),4000)}
function toast(m){const t=$('toast');t.textContent=m;t.className='show';setTimeout(()=>t.className='',2600)}
const S=()=>D.settings,active=b=>D.issues.filter(i=>i.bookId==b.id&&!i.returned).length,avail=b=>b.copies-active(b);
const fine=i=>Math.max(0,diff(i.returned||today(),i.due))*S().fine,status=i=>i.returned?['Returned','ok']:diff(today(),i.due)>0?['Overdue','late']:['Issued','out'];
const bk=id=>D.books.find(b=>b.id==id)||{title:'(deleted)'},mb=id=>D.members.find(m=>m.id==id)||{name:'(deleted)'};
const ENT={books:{l:'Book',f:[['acc','Accession no.'],['title','Title'],['author','Author'],['cat','Category / subject'],['copies','Copies','number']],cols:[['Acc.',b=>h(b.acc)],['Book',b=>`<b>${h(b.title)}</b><br><small>${h(b.author)}</small>`],['Category',b=>h(b.cat)],['Available',b=>`<span class="pill ${avail(b)?'ok':'late'}">${avail(b)} of ${b.copies}</span>`]]},
 members:{l:'Student',f:[['adm','Admission no.'],['name','Name'],['cls','Class / section'],['phone','Parent phone']],cols:[['Adm.',m=>h(m.adm)],['Name',m=>`<b>${h(m.name)}</b>`],['Class',m=>h(m.cls)],['Books out',m=>D.issues.filter(i=>i.memId==m.id&&!i.returned).length]]}};
const RANK={view:0,lib:1,admin:2},ROLE={view:'Viewer',lib:'Librarian',admin:'Admin'},can=n=>!!me&&RANK[me.role]>=n,PG=50;
const SEARCH={books:b=>[b.acc,b.title,b.author,b.cat],members:m=>[m.adm,m.name,m.cls,m.phone]};
const find=(t,v)=>{const w=v.toLowerCase().split(/\s+/).filter(Boolean);return D[t].filter(r=>{const x=SEARCH[t](r).join(' ').toLowerCase();return w.every(k=>x.includes(k))})};
const API=()=>S().gas||DEFAULT_GAS,post=o=>fetch(API(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)}).then(r=>r.json()),ERR={bad:'Wrong user ID or password',locked:'Too many wrong attempts. Try again in 10 minutes',auth:'Please sign in again',short:'Password must be 8+ characters',server:'Server error. Try again',perm:'Not allowed',taken:'That user ID is taken',lastadmin:'Keep at least one admin',self:'You cannot delete your own account'};let CP;
async function brand(){try{const b={...window.BRAND};if(API()&&navigator.onLine){const r=await post({act:'brand'});if(r&&r.name)b.name=r.name;if(r&&r.logo)b.logo=r.logo}
 if(b.name)S().name=b.name;if(b.logo)S().logo=b.logo;persist()}catch(e){}}
function boot(){const t=S().tok;if(t&&+t.split('.')[0]>Date.now()&&S().me){me=S().me;render();sync(0)}else login()}
function logout(){delete S().tok;delete S().me;persist();me=null;stu=null;login()}
function login(){const L=$('login');L.hidden=false;L.innerHTML=`<div class="lbox"><div class="logo">${S().logo?`<img src="${S().logo}" alt="">`:'Logo'}</div><h2 style="text-align:center">${h(S().name||'School Library')}</h2>`+(API()?'':`<label>Library server URL</label><input id="lgu" placeholder="https://script.google.com/macros/s/…/exec">`)+`<label>User ID</label><input id="lu" autocomplete="username" value="${h(S().lastUser||'')}"><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"><p class="err" id="le"></p><button class="b" onclick="doLogin()">Sign in</button></div>`;$('lu').focus()}
async function doLogin(){if($('lgu')){S().gas=$('lgu').value.trim();persist()}const u=$('lu').value.trim(),p=$('lp').value,e=$('le');if(!API())return e.textContent='Enter the library server URL';if(!navigator.onLine)return e.textContent='Connect to the internet to sign in';e.textContent='Signing in…';try{const r=await post({act:'login',u,p});if(r.must)return changePw(u,p);if(r.error)return e.textContent=ERR[r.error]||'Sign-in failed';enter(r,u)}catch(x){e.textContent='Cannot reach the server. Check the URL and your internet'}}
function enter(r,u){S().tok=r.token;S().me=r.user;S().lastUser=u;persist();me=r.user;$('login').hidden=true;render();sync(0)}
function changePw(u,p){CP={u,p};$('login').querySelector('.lbox').innerHTML=`<h2>Set a new password</h2><p>For security, choose your own password (8+ characters) before continuing.</p><label>New password</label><input id="n1" type="password" autocomplete="new-password"><label>Repeat new password</label><input id="n2" type="password" autocomplete="new-password" onkeydown="if(event.key=='Enter')doChange()"><p class="err" id="le"></p><button class="b" onclick="doChange()">Save and continue</button>`;$('n1').focus()}
async function doChange(){const a=$('n1').value,e=$('le');if(a.length<8)return e.textContent=ERR.short;if(a!=$('n2').value)return e.textContent='The two passwords do not match';if(a==CP.p)return e.textContent='Choose a different password';try{const r=await post({act:'chpw',u:CP.u,p:CP.p,np:a});r.error?e.textContent=ERR[r.error]||'Failed':enter(r,CP.u)}catch(x){e.textContent='Cannot reach the server'}}
function myPw(){$('dlg').innerHTML=`<h2>Change my password</h2><label>Current password</label><input id="o1" type="password"><label>New password (8+ characters)</label><input id="n1" type="password"><p class="err" id="le"></p><button class="b" onclick="doMy()">Save</button> <button class="b alt" onclick="dlg.close()">Cancel</button>`;$('dlg').showModal()}
async function doMy(){const a=$('n1').value,e=$('le');if(a.length<8)return e.textContent=ERR.short;try{const r=await post({act:'chpw',u:me.username,p:$('o1').value,np:a});if(r.error)return e.textContent=ERR[r.error]||'Failed';S().tok=r.token;persist();dlg.close();toast('Password changed')}catch(x){e.textContent='Cannot reach the server'}}
function usersCard(){return`<div class="card"><div class="tools"><h3 style="flex:1">Users and passwords</h3><button class="b" onclick="userDlg()">+ Add user</button></div>${tbl(['Name','User ID','Role',''],D.users.map(u=>`<tr><td>${h(u.name)}</td><td>${h(u.username)}</td><td>${ROLE[u.role]}</td><td class="act"><button onclick="userDlg('${u.id}')">Edit</button><button class="dl" onclick="delUser('${u.id}')">Delete</button></td></tr>`),'No users')}</div>`}
function userDlg(id){const u=D.users.find(x=>x.id==id)||{role:'lib'};$('dlg').innerHTML=`<h2>${id?'Edit':'Add'} user</h2><div class="grid2" style="margin:14px 0"><div><label>Full name</label><input id="un" value="${h(u.name||'')}"></div><div><label>User ID</label><input id="uu" value="${h(u.username||'')}"></div><div><label>${id?'New password (blank keeps old)':'Password (8+ characters)'}</label><input id="up" type="password"></div><div><label>Role</label><select id="ur"><option value="view">Viewer: search only</option><option value="lib">Librarian: issue, return, add</option><option value="admin">Admin: everything</option></select></div></div><button class="b" onclick="saveUser('${id||''}')">Save user</button> <button class="b alt" onclick="dlg.close()">Cancel</button>`;$('ur').value=u.role;$('dlg').showModal()}
async function saveUser(id){const n=$('un').value.trim(),us=$('uu').value.trim().toLowerCase(),p=$('up').value,r=$('ur').value;if(!n||!us||(!id&&!p)||(p&&p.length<8))return toast('Fill in name, user ID and a password of 8+ characters');try{const x=await post({act:'user',op:'save',token:S().tok,user:{id,name:n,username:us,role:r,pw:p}});if(x.error)return toast(ERR[x.error]||'Could not save');D.users=x.users;persist();dlg.close();render();toast(id?'User saved':'User added. They must choose their own password at first sign-in')}catch(e){toast('Cannot reach the server. Users can only be changed online')}}
async function delUser(id){const u=D.users.find(x=>x.id==id);if(u.id==me.id)return toast(ERR.self);if(!confirm('Delete '+u.name+'?'))return;try{const x=await post({act:'user',op:'del',token:S().tok,user:{id}});if(x.error)return toast(ERR[x.error]||'Could not delete');D.users=x.users;persist();render()}catch(e){toast('Cannot reach the server')}}
function render(){if(!me)return;if(tab=='set'&&!can(2))tab='dash';const s=S();$('sn').textContent=s.name||'Your School Name';$('lg').innerHTML=s.logo?`<img src="${s.logo}" alt="School logo">`:'Your school logo';
 $('hn').textContent=s.name||'Your School';$('hl').innerHTML=s.logo?`<img src="${s.logo}" alt="">`:'';$('hd').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · Read today, lead tomorrow';
 $('nav').innerHTML=TABS.filter(t=>(t[0]!='set'||can(2))&&(t[0]!='issue'||can(1))).map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]} ${t[2]}</button>`).join('');$('ttl').textContent=TABS.find(t=>t[0]==tab)[2];
 $('v').innerHTML=({dash:vDash,books:()=>vList('books'),members:()=>vList('members'),issue:vIssue,rec:vRec,rep:vRep,set:vSet})[tab]();chips();if(tab=='books'||tab=='members')rows();if(tab=='rec')recs();if(tab=='rep')repT();if(tab=='issue'){sCard();$('mq').focus()}}
function chips(){const n=navigator.onLine;$('usr').textContent=me?me.name+' ('+ROLE[me.role]+')':'';$('net').className='chip '+(n?'on':'off');$('net').textContent=n?'● Online':'● Offline (saved on this device)';$('xl').textContent=fh?'Excel: '+fh.name:'Excel: not linked'}
function go(t){tab=t;q='';flt='all';pg=0;cf='';render()}
function vDash(){const a=D.issues.filter(i=>!i.returned),od=a.filter(i=>diff(today(),i.due)>0);
 return`<div class="tiles"><div class="tile t1"><b>${D.books.length}</b>Book titles</div><div class="tile t4"><b>${D.books.reduce((s,b)=>s+Number(b.copies||0),0)}</b>Total copies</div><div class="tile t3"><b>${D.members.length}</b>Students</div><div class="tile t5"><b>${a.length}</b>Books out now</div><div class="tile t2"><b>${od.length}</b>Overdue</div></div>
 <div class="card"><h3>Overdue books</h3>${tbl(['Student','Book','Due','Fine'],od.map(i=>`<tr><td>${h(mb(i.memId).name)}</td><td>${h(bk(i.bookId).title)}</td><td>${i.due}</td><td>₹${fine(i)}</td></tr>`),'Nothing overdue. Nice work!')}</div>
 <div class="card"><h3>Latest activity</h3>${tbl(['Date','Student','Book','Status'],D.issues.slice(-6).reverse().map(i=>`<tr><td>${i.returned||i.issued}</td><td>${h(mb(i.memId).name)}</td><td>${h(bk(i.bookId).title)}</td><td>${pill(i)}</td></tr>`),'No activity yet. Add books and students, then issue your first book.')}</div>`}
const pill=i=>{const s=status(i);return`<span class="pill ${s[1]}">${s[0]}</span>`},tbl=(hd,rows,em)=>rows.length?`<div class="wrap"><table class="tbl"><tr>${hd.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`:`<div class="empty">${em}</div>`;
function fl(t){const w=q.toLowerCase().split(/\s+/).filter(Boolean),L=D[t].filter(r=>{if(cf&&(t=='members'?parseInt(r.cls)!=cf:r.cat!=cf))return 0;const x=SEARCH[t](r).join(' ').toLowerCase();return w.every(k=>x.includes(k))});return L.sort(t=='members'?(a,b)=>(parseInt(a.cls)||0)-(parseInt(b.cls)||0)||String(a.name).localeCompare(b.name):(a,b)=>String(a.title).localeCompare(b.title))}
function vList(t){const E=ENT[t],o=t=='members'?[...Array(12)].map((_,i)=>[i+1,'Class '+(i+1)]):[...new Set(D.books.map(b=>b.cat).filter(Boolean))].sort().map(c=>[c,c]);
 return`<div class="card"><div class="tools"><input id="sq" placeholder="Search ${t=='books'?'title, author or accession no.':'name, class or admission no.'}" value="${h(q)}" oninput="q=this.value;pg=0;rows()" aria-label="Search"><select style="max-width:170px" onchange="cf=this.value;pg=0;rows()" aria-label="Filter"><option value="">${t=='members'?'All classes':'All categories'}</option>${o.map(x=>`<option value="${h(x[0])}" ${cf==x[0]?'selected':''}>${h(x[1])}</option>`).join('')}</select>${can(1)?`<button class="b" onclick="edit('${t}')">+ Add ${E.l.toLowerCase()}</button>`:''}</div><div id="rows"></div></div>`}
function rows(){const t=tab,E=ENT[t],L=fl(t),n=L.length,a=pg*PG;$('rows').innerHTML=tbl(E.cols.map(c=>c[0]).concat(['']),L.slice(a,a+PG).map(r=>`<tr>${E.cols.map(c=>`<td>${c[1](r)}</td>`).join('')}<td class="act">${can(1)?`<button onclick="edit('${t}','${r.id}')">Edit</button>`:''}${can(2)?`<button class="dl" onclick="del('${t}','${r.id}')">Delete</button>`:''}</td></tr>`),'Nothing found. Try fewer words.')+(n>PG?`<div class="tools" style="margin-top:12px;align-items:center"><button class="b alt" ${pg?'':'disabled'} onclick="pg--;rows()">Previous</button><span>${a+1} to ${Math.min(n,a+PG)} of ${n}</span><button class="b alt" ${a+PG<n?'':'disabled'} onclick="pg++;rows()">Next</button></div>`:`<p style="color:var(--mut)">${n} found</p>`)}
function edit(t,id){const E=ENT[t],r=id?D[t].find(x=>x.id==id):{};$('dlg').innerHTML=`<h2>${id?'Edit':'Add'} ${E.l.toLowerCase()}</h2><div class="grid2" style="margin:14px 0">${E.f.map(f=>`<div><label>${f[1]}</label><input id="f_${f[0]}" type="${f[2]||'text'}" value="${h(r[f[0]]??(f[2]?1:''))}"></div>`).join('')}</div><button class="b" onclick="saveRec('${t}','${id||''}')">Save ${E.l.toLowerCase()}</button> <button class="b alt" onclick="dlg.close()">Cancel</button>`;$('dlg').showModal()}
function saveRec(t,id){const E=ENT[t],o={};E.f.forEach(f=>o[f[0]]=f[2]?Number($('f_'+f[0]).value||0):$('f_'+f[0]).value.trim());if(!o[E.f[1][0]])return toast('Please fill in the '+E.f[1][1].toLowerCase());
 if(id)Object.assign(D[t].find(x=>x.id==id),o);else D[t].push({id:uid(),...o});dlg.close();save();render();toast(E.l+' saved')}
function del(t,id){if(D.issues.some(i=>(i.bookId==id||i.memId==id)&&!i.returned))return toast('Return its open loans first');if(confirm('Delete this record?')){D[t]=D[t].filter(x=>x.id!=id);save();render()}}
function vIssue(){return`<div class="grid2" style="align-items:start"><div class="card"><h3>1 · Student</h3><input id="mq" placeholder="Scan ID, or type name or class" oninput="dFind('members')" onkeydown="dKey(event,'members')" autocomplete="off"><div id="mres"></div><div id="scard"></div></div><div class="card"><h3>2 · Book</h3><input id="bq" placeholder="Scan accession no., or type title or author" oninput="dFind('books')" onkeydown="dKey(event,'books')" autocomplete="off"><div id="bres"></div></div></div><div class="card"><h3>Quick return</h3><input id="rq" placeholder="Scan the book's accession no. and press Enter" onkeydown="if(event.key=='Enter')qRet()"></div>`}
function dFind(t){const v=$(t=='books'?'bq':'mq').value.trim(),el=$(t=='books'?'bres':'mres');if(!v){el.innerHTML='';return}
 el.innerHTML=find(t,v).slice(0,8).map(r=>t=='books'?`<button class="res" onclick="issueTo('${r.id}')"><span><b>${h(r.title)}</b><br><small>${h(r.author)}, ${h(r.acc)}</small></span><span class="pill ${avail(r)>0?'ok':'late'}">${avail(r)>0?'Issue':'All out'}</span></button>`:`<button class="res" onclick="pickM('${r.id}')"><span><b>${h(r.name)}</b><br><small>Class ${h(r.cls)}, Adm ${h(r.adm)}</small></span></button>`).join('')||'<div class="empty">No match</div>'}
function dKey(e,t){if(e.key!='Enter')return;const v=e.target.value.trim().toLowerCase(),L=find(t,v),x=L.find(r=>String(t=='books'?r.acc:r.adm).toLowerCase()==v)||(L.length==1&&L[0]);if(x)t=='books'?issueTo(x.id):pickM(x.id)}
function pickM(id){stu=id;$('mq').value='';$('mres').innerHTML='';sCard();$('bq').focus()}
function sCard(){const el=$('scard');if(!el)return;if(!stu){el.innerHTML='';return}const m=mb(stu),a=D.issues.filter(i=>i.memId==stu&&!i.returned);
 el.innerHTML=`<div class="scard"><b>${h(m.name)}</b><br>Class ${h(m.cls)}, Adm ${h(m.adm)}<br>${a.length} of ${S().max||2} books out</div>`+a.map(i=>`<div class="res"><span>${h(bk(i.bookId).title)}<br><small>Due ${i.due}${fine(i)?', fine ₹'+fine(i):''}</small></span><button class="b" onclick="ret('${i.id}')">Return</button></div>`).join('')+`<button class="b alt" style="margin-top:10px" onclick="stu=null;sCard();$('mq').focus()">Done, next student</button>`}
function issueTo(bid){if(!can(1))return;if(!stu){toast('Pick a student first');$('mq').focus();return}const b=bk(bid),n=D.issues.filter(i=>i.memId==stu&&!i.returned).length;if(avail(b)<1)return toast('No copy of this book is in');if(n>=(S().max||2))return toast('This student already has the maximum books');
 const d=addD(today(),S().days);D.issues.push({id:uid(),bookId:bid,memId:stu,issued:today(),due:d,returned:''});save();$('bq').value='';$('bres').innerHTML='';sCard();$('bq').focus();toast('Issued: '+b.title+', due '+d)}
function qRet(){const v=$('rq').value.trim().toLowerCase(),b=D.books.find(x=>String(x.acc).toLowerCase()==v),i=b&&D.issues.find(x=>x.bookId==b.id&&!x.returned);if(!i)return toast('No open loan for that accession no.');ret(i.id);$('rq').focus()}
function ret(id){const i=D.issues.find(x=>x.id==id);i.returned=today();save();render();toast(fine(i)?'Returned. Fine due: ₹'+fine(i):'Returned on time')}
function vRec(){return`<div class="card"><div class="tools"><input placeholder="Search student, class or book" value="${h(q)}" oninput="q=this.value;recs()" aria-label="Search"><select style="max-width:200px" onchange="flt=this.value;recs()" aria-label="Filter">${[['all','All records'],['out','Out on loan'],['late','Overdue'],['done','Returned']].map(o=>`<option value="${o[0]}" ${flt==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div id="rows"></div></div>`}
function recs(){const w=q.toLowerCase().split(/\s+/).filter(Boolean),L=D.issues.slice().reverse().filter(i=>{if(!(flt=='all'||(flt=='out'&&!i.returned)||(flt=='late'&&status(i)[1]=='late')||(flt=='done'&&i.returned)))return 0;const m=mb(i.memId),x=[m.name,m.cls,m.adm,bk(i.bookId).title].join(' ').toLowerCase();return w.every(k=>x.includes(k))});
 $('rows').innerHTML=tbl(['Issued','Student','Book','Due','Status','Fine',''],L.slice(0,150).map(i=>`<tr><td>${i.issued}</td><td>${h(mb(i.memId).name)}<br><small>Class ${h(mb(i.memId).cls)}</small></td><td>${h(bk(i.bookId).title)}</td><td>${i.due}</td><td>${pill(i)}</td><td>₹${fine(i)}</td><td class="act">${i.returned||!can(1)?'':`<button onclick="ret('${i.id}')">Return</button>`}</td></tr>`),'No records match.')+(L.length>150?`<p style="color:var(--mut)">Showing the latest 150 of ${L.length}. Search to narrow down.</p>`:'')}
let rf=today().slice(0,8)+'01',rt=today();
function vRep(){return`<div class="card"><div class="tools" style="align-items:end"><div><label>From</label><input type="date" value="${rf}" onchange="rf=this.value;repT()"></div><div><label>To</label><input type="date" value="${rt}" onchange="rt=this.value;repT()"></div><button class="b" onclick="window.print()">Print</button><button class="b alt" onclick="repX()">Download .xlsx</button></div><p style="color:var(--mut)">Available, Out now and Overdue show the position today. Issued and Returned count only the dates chosen above.</p><div id="rrows"></div></div>`}
function repData(){const C={};D.books.forEach(b=>{const c=b.cat||'Uncategorised',r=C[c]=C[c]||{c,t:0,n:0,av:0,out:0,od:0,is:0,re:0};r.t++;r.n+=Number(b.copies||0);r.av+=avail(b)});
 D.issues.forEach(i=>{const r=C[bk(i.bookId).cat||'Uncategorised'];if(!r)return;if(!i.returned){r.out++;if(diff(today(),i.due)>0)r.od++}if(i.issued>=rf&&i.issued<=rt)r.is++;if(i.returned&&i.returned>=rf&&i.returned<=rt)r.re++});
 return Object.values(C).sort((a,b)=>a.c.localeCompare(b.c))}
function repT(){const R=repData(),K=['t','n','av','out','od','is','re'],s=k=>R.reduce((a,r)=>a+r[k],0);
 $('rrows').innerHTML=tbl(['Category','Titles','Copies','Available','Out now','Overdue','Issued','Returned'],R.map(r=>`<tr><td><b>${h(r.c)}</b></td>${K.map(k=>`<td>${r[k]}</td>`).join('')}</tr>`).concat(R.length?[`<tr><td><b>Total</b></td>${K.map(k=>`<td><b>${s(k)}</b></td>`).join('')}</tr>`]:[]),'No books yet.')}
function repX(){if(!window.XLSX)return wb();const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(repData().map(r=>({Category:r.c,Titles:r.t,Copies:r.n,Available:r.av,'Out now':r.out,Overdue:r.od,Issued:r.is,Returned:r.re}))),'Category report');XLSX.writeFile(w,`category-report-${rf}_to_${rt}.xlsx`)}
function vSet(){const s=S();return`<div class="card"><h3>Library rules</h3><p style="color:var(--mut)">School name and logo are loaded automatically from the BRAND setting in this file or from the Branding tab of the Google Sheet.</p><div class="grid2" style="margin:12px 0"><div><label>Loan period (days)</label><input type="number" value="${s.days}" oninput="S().days=+this.value;save()"></div><div><label>Max books per student</label><input type="number" value="${s.max||2}" oninput="S().max=+this.value;save()"></div><div><label>Late fine per day (₹)</label><input type="number" value="${s.fine}" oninput="S().fine=+this.value;save()"></div></div></div>
 ${can(2)?usersCard():''}<div class="card"><h3>Excel file on this computer</h3><p>Link an .xlsx file and every change is saved into it automatically (Chrome or Edge). Other browsers can use import and export.</p><div class="tools"><button class="b" onclick="link(0)">Open existing Excel file</button><button class="b" onclick="link(1)">Create new Excel file</button><button class="b alt" onclick="exportX()">Download backup .xlsx</button><button class="b alt" onclick="tpl()">Blank import template</button><button class="b alt" onclick="$('imp').click()">Import .xlsx</button><input id="imp" type="file" accept=".xlsx" hidden onchange="importX(this.files[0])"></div></div>
 <div class="card"><h3>My account</h3><p>Signed in as ${h(me.name)} (${h(me.username)}). Data syncs with Google Sheets whenever you are online.</p><div class="tools"><button class="b" onclick="myPw()">Change my password</button><button class="b alt" onclick="sync(1)">Sync now</button></div></div>`}
const NAMES={Books:'books',Members:'members',Issues:'issues'},HEAD={Books:['id','acc','title','author','cat','copies'],Members:['id','adm','name','cls','phone'],Issues:['id','bookId','memId','issued','due','returned']};
function wb(){if(!window.XLSX){toast('Excel library not loaded. Connect once to the internet or place xlsx.full.min.js beside this file.');return null}const w=XLSX.utils.book_new();for(const n in NAMES)XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(D[NAMES[n]],{header:HEAD[n]}),n);XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet([{name:S().name,fine:S().fine,days:S().days}]),'Settings');return w}
function fromWb(w){for(const n in NAMES){const s=w.Sheets[n];if(s)D[NAMES[n]]=XLSX.utils.sheet_to_json(s,{raw:false,defval:''}).map(r=>({...r,id:String(r.id||uid()),copies:r.copies!==undefined?Number(r.copies)||1:undefined}));}const st=w.Sheets.Settings&&XLSX.utils.sheet_to_json(w.Sheets.Settings)[0];if(st){S().name=st.name||S().name;S().fine=+st.fine||S().fine;S().days=+st.days||S().days}}
function exportX(){const w=wb();if(w)XLSX.writeFile(w,'school-library.xlsx')}
function tpl(){if(!window.XLSX)return wb();const w=XLSX.utils.book_new(),a=(n,r)=>XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([r]),n);a('Books',['acc','title','author','cat','copies']);a('Members',['adm','name','cls','phone']);XLSX.writeFile(w,'library-import-template.xlsx')}
async function importX(f){if(!f||!window.XLSX)return;const w=XLSX.read(await f.arrayBuffer()),hd=n=>w.Sheets[n]?(XLSX.utils.sheet_to_json(w.Sheets[n],{header:1})[0]||[]):[];
 if(hd('Books').includes('id')||hd('Members').includes('id')){if(!confirm('This is a full backup. It will replace the current books, students and records. Continue?'))return;fromWb(w);toast('Backup restored')}
 else{let a=0,u=0;[['Books','books','acc'],['Members','members','adm']].forEach(([sn,t,k])=>{if(!w.Sheets[sn])return;XLSX.utils.sheet_to_json(w.Sheets[sn],{raw:false,defval:''}).forEach(r=>{if(!r[k])return;if(t=='books')r.copies=Number(r.copies)||1;const x=D[t].find(y=>String(y[k])==String(r[k]));if(x){Object.assign(x,r);u++}else{D[t].push({id:uid(),...r});a++}})});toast(a+' added, '+u+' updated')}
 save();render()}
async function link(create){if(!window.showOpenFilePicker)return toast('Use Chrome or Edge for live Excel linking, or use import and export');if(!window.XLSX)return wb();
 try{const o={types:[{description:'Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]};
 fh=create?await showSaveFilePicker({...o,suggestedName:'school-library.xlsx'}):(await showOpenFilePicker(o))[0];
 if(!create){fromWb(XLSX.read(await(await fh.getFile()).arrayBuffer()));persist()}await writeFile();render();toast('Excel linked: changes save automatically')}catch(e){}}
async function writeFile(){if(!fh||!window.XLSX)return;try{const w=await fh.createWritable();await w.write(XLSX.write(wb(),{type:'array',bookType:'xlsx'}));await w.close()}catch(e){toast('Could not write to Excel. Is it open in another program?')}}
async function sync(manual){if(!API()||!me||!S().tok)return;if(!navigator.onLine){manual&&toast('Offline. Changes are saved here and will sync later');return}
 const sent=D.updated,dirty=sent>(S().synced||0)&&can(1);
 try{const r=await post({act:'sync',token:S().tok,updated:sent,data:dirty?{Books:D.books,Members:D.members,Issues:D.issues}:null});
 if(r.error=='auth'){toast('Please sign in again');return logout()}if(r.error){manual&&toast('Sync failed');return}
 if(r.users){D.users=r.users;const m=r.users.find(x=>x.id==me.id);if(!m)return logout();me=S().me=m}
 if(r.Books){for(const n in NAMES)D[NAMES[n]]=(r[n]||[]).map(x=>({...x,copies:x.copies!==undefined?Number(x.copies):undefined}));D.updated=r.updated;S().synced=r.updated;persist();render();manual&&toast('Pulled latest from Google Sheets')}
 else{if(r.pushed)S().synced=sent;persist();manual&&toast(r.pushed?'Synced to Google Sheets':'Already up to date')}}catch(e){manual&&toast('Sync failed. Check the server URL and your internet')}}
addEventListener('online',()=>{chips();sync(0)});addEventListener('offline',chips);brand().finally(boot);
</script></body></html>
